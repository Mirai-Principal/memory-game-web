<main class="h-screen h-[100dvh] w-full overflow-hidden flex items-center justify-center">
  @if (currentScreen() === 'inicio') {
    <div class="relative h-full aspect-[3387/6021] max-w-full flex items-center justify-center animate-fade-in">
      <img
        src="images/inicio.jpg"
        alt="Aprende con Frizac - Inicio"
        class="h-full w-full object-contain pointer-events-none select-none drop-shadow-xl"
      />

      <!-- Botón para iniciar el juego -->
      <div class="absolute bottom-[6%] w-full flex justify-center px-6 z-10">
        <app-button
          text="Jugar ¡ahora!"
          (clicked)="onStartGame()"
        ></app-button>
      </div>
    </div>
  } @else if (currentScreen() === 'juego') {
    <div class="relative h-full aspect-[3623/6437] max-w-full flex items-center justify-center animate-fade-in">
      <img
        src="images/fondo_juego.jpg"
        alt="Aprende con Frizac - Tablero"
        class="h-full w-full object-contain pointer-events-none select-none drop-shadow-xl"
      />

      <!-- Contenedor del área de juego / tablero -->
    </div>
  }
</main>

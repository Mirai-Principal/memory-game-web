<div
  class="fixed inset-0 bg-[#002D54]/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 animate-fade-in"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
>
  <div
    class="modal-card rounded-3xl p-3 sm:p-6 flex flex-col items-center text-center shadow-2xl w-full max-h-[92dvh] max-h-[92vh]"
    [class]="maxWidthClass()"
    [class.modal-card-row]="headerLayout() === 'row'"
  >
    @if (headerLayout() === 'row') {
      <!-- Encabezado en una sola fila (2 columnas: Título a la izquierda, Imagen a la derecha) -->
      <div class="grid grid-cols-[1.2fr_1fr] sm:grid-cols-2 gap-3 sm:gap-5 items-center w-full my-0.5">
        <!-- Columna Izquierda: Título en azul oscuro -->
        <div class="text-left flex flex-col justify-center min-w-0 pr-1">
          @if (title()) {
            <h2 class="modal-match-title font-black text-[#003087] tracking-tight drop-shadow-xs font-['Fredoka',sans-serif]">
              {{ title() }}
            </h2>
          }
        </div>

        <!-- Columna Derecha: Imagen con animación suave de rebote -->
        @if (imageSrc()) {
          <div class="flex items-center justify-center">
            <img
              [src]="imageSrc()"
              [alt]="imageAlt()"
              class="modal-match-img object-contain drop-shadow-xl pointer-events-none select-none animate-bounce-subtle"
            />
          </div>
        }
      </div>

      <!-- Subtítulo / Descripción centrada en celeste (#00AEEF) -->
      @if (subtitle()) {
        <p class="modal-match-subtitle text-[#00AEEF] font-extrabold leading-snug tracking-tight text-center max-w-[96%] mx-auto my-1 sm:my-1.5">
          {{ subtitle() }}
        </p>
      }
    } @else {
      <!-- Encabezado vertical estándar (en columna) -->
      <div class="w-full flex flex-col justify-center items-center my-0.5 min-h-0">
        @if (title()) {
          <h2 class="modal-standard-title text-xl sm:text-2xl font-black text-[#00569D] tracking-wide drop-shadow-xs mb-1 shrink-0 font-['Fredoka',sans-serif]">
            {{ title() }}
          </h2>
        }

        @if (imageSrc()) {
          <img
            [src]="imageSrc()"
            [alt]="imageAlt()"
            class="modal-standard-img object-contain drop-shadow-md mb-1.5 animate-bounce-subtle pointer-events-none select-none shrink-0"
          />
        }

        @if (subtitle()) {
          <p class="modal-standard-subtitle text-[#004B8F] text-sm sm:text-base font-semibold leading-relaxed whitespace-pre-line my-0.5 shrink-0">
            {{ subtitle() }}
          </p>
        }

        <!-- Contenido proyectado personalizado (si se proporciona) -->
        <div class="modal-body text-[#004B8F] text-sm sm:text-base font-semibold my-0.5 w-full overflow-y-auto">
          <ng-content></ng-content>
        </div>
      </div>
    }

    <!-- Acciones / Botones -->
    <div class="mt-2 sm:mt-4 flex flex-col gap-1.5 sm:gap-2.5 w-full items-center shrink-0">
      @if (primaryButtonText()) {
        <app-button
          [text]="primaryButtonText()"
          size="md"
          (clicked)="onPrimaryClick()"
        ></app-button>
      }

      @if (secondaryButtonText()) {
        <button
          type="button"
          (click)="onSecondaryClick()"
          class="text-[#00569D]/80 hover:text-[#00569D] text-xs sm:text-sm font-bold underline underline-offset-4 cursor-pointer mt-1 transition"
        >
          {{ secondaryButtonText() }}
        </button>
      }
    </div>
  </div>
</div>
